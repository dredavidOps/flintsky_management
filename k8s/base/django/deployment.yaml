apiVersion: apps/v1
kind: Deployment
metadata:
  name: django
  namespace: flintsky
  labels:
    app: django
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: django
  template:
    metadata:
      labels:
        app: django
    spec:
      initContainers:
      - name: wait-for-db
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for db; sleep 2; done;']
      - name: migrate
        image: flintsky/backend:latest
        command: ['python', 'manage.py', 'migrate']
        envFrom:
        - configMapRef:
            name: flintsky-config
        - secretRef:
            name: flintsky-secrets
      - name: collectstatic
        image: flintsky/backend:latest
        command: ['python', 'manage.py', 'collectstatic', '--noinput']
        envFrom:
        - configMapRef:
            name: flintsky-config
        - secretRef:
            name: flintsky-secrets
      containers:
      - name: django
        image: flintsky/backend:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: flintsky-config
        - secretRef:
            name: flintsky-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
