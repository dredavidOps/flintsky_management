services:
  - type: web
    name: flintsky-api
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn propertymgmt.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "localhost,127.0.0.1"
      - key: DATABASE_URL
        fromDatabase:
          name: flintsky-db
          property: connectionString
      - key: FRONTEND_URL
        value: "https://your-frontend-url.netlify.app"  # UPDATE AFTER FRONTEND DEPLOY

databases:
  - name: flintsky-db
    databaseName: propertymgmt
    user: postgres
    plan: free
